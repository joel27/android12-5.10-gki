
name: GKI + ReSukiSU + SuSFS + ZeroMount VFS (ThinLTO) – Tech-Kernel Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout GKI kernel source (ESK generic)
        uses: actions/checkout@v4
        with:
          repository: ESK-Project/android12-5.10-gki
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-wñ14

      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      - name: Install ReSukiSU (inline hook)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/ESK-Project/ReSukiSU/main/kernel/setup.sh" \
            | bash -s main
          echo "ReSukiSU installed"

      - name: Fix sulog type mismatch
        run: |
          SULOG=drivers/kernelsu/sulog/event.c
          if [ -f "$SULOG" ]; then
            sed -i 's/USER_ARG_NULL,/\&(struct user_arg_ptr){ 0 },/g' "$SULOG"
            echo "Patched $SULOG"
          fi

      - name: Apply SuSFS (susfs4ksu 50_)
        run: |
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -R /tmp/susfs4ksu/kernel_patches/fs/*      fs/
          cp -R /tmp/susfs4ksu/kernel_patches/include/* include/
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          echo "SuSFS base applied"

      - name: Add SELinux stubs
        run: |
          cat > kernel/ksu_selinux_stubs.c << 'EOF'
          #include <linux/types.h>
          #include <linux/export.h>

          int  ksu_selinux_init(void)            { return 0; }
          void ksu_selinux_exit(void)            { }
          int  ksu_selinux_audit_hook(void)      { return 0; }
          int  ksu_selinux_setprocattr_hook(void){ return 0; }
          void ksu_selinux_update_policy(void)   { }
          int  ksu_selinux_check_policy(void)    { return 0; }
          EOF

          grep -q "ksu_selinux_stubs.o" kernel/Makefile || \
            echo "obj-y += ksu_selinux_stubs.o" >> kernel/Makefile

      - name: Apply ZeroMount VFS patch from Super-Builders
        run: |
          git clone --depth=1 \
            https://github.com/Enginex0/Super-Builders.git /tmp/sb
          PATCH="/tmp/sb/android12-5.10/ReSukiSU/patches/60_zeromount-android12-5.10.patch"
          if [ -f "$PATCH" ]; then
            patch -p1 --fuzz=3 --no-backup-if-mismatch < "$PATCH" || true
            echo "ZeroMount VFS patch applied (with tolerance)"
          else
            echo "Patch not found, skipping"
          fi

      - name: Fix task_mmu.c for ZeroMount
        run: |
          if [ -f fs/proc/task_mmu.c ]; then
            sed -i 's/zeromount_spoof_mmap_metadata(inode,/zeromount_spoof_mmap_metadata(vma->vm_file ? file_inode(vma->vm_file) : NULL,/g' \
              fs/proc/task_mmu.c
            echo "task_mmu.c fixed"
          fi

      - name: Remove unused zm_out labels
        run: |
          find . -name "*.c" -exec sed -i '/^[[:space:]]*zm_out:[[:space:]]*$/d' {} \;
          echo "Removed unused zm_out labels"

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Configure kernel
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable  CONFIG_KSU \
            --enable  CONFIG_KSU_SUSFS \
            --enable  CONFIG_KSU_INLINE_HOOK \
            --disable CONFIG_KSU_KPROBES_HOOK \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_ZEROMOUNT \
            --set-str CONFIG_LOCALVERSION "" \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE

          ./scripts/config --file out/.config --enable CONFIG_TCP_CONG_BBR
          ./scripts/config --file out/.config --disable CONFIG_POLLY || true

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC=clang LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_TIMESTAMP="Wed Jun 18 00:00:00 UTC 2025" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="esk" \
            Image 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/ESK-Project/AnyKernel3.git \
            -b generic AnyKernel3
          rm -rf AnyKernel3/config AnyKernel3/modules \
                 AnyKernel3/patch  AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          zstd -19 --no-progress -q -o AnyKernel3/Image.zst AnyKernel3/Image
          rm AnyKernel3/Image
          cd AnyKernel3
          sha256sum Image.zst > Image.zst.sha256
          printf '%s\n' \
            "properties() { '" \
            'kernel.string=Tech-Kernel GKI 5.10 + ZeroMount VFS | Stable' \
            'do.devicecheck=0' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'supported.versions=' \
            "'; }" \
            'BLOCK=boot' \
            'IS_SLOT_DEVICE=1' \
            'RAMDISK_COMPRESSION=auto' \
            'PATCH_VBMETA_FLAG=auto' \
            'NO_MAGISK_CHECK=true' \
            '. tools/ak3-core.sh' \
            '"$BIN/busybox" sha256sum -cs Image.zst.sha256 || abort "[!] SHA256 mismatch"' \
            '"$BIN/zstd" -d -q --no-progress -o "$AKHOME/Image" "$AKHOME/Image.zst" || abort "[!] Decompress failed"' \
            'split_boot' \
            'if [ -f "$SPLITIMG/ramdisk.cpio" ]; then' \
            '  unpack_ramdisk; write_boot' \
            'else' \
            '  flash_boot' \
            'fi' \
            'rm -f "$AKHOME/Image"' \
            > anykernel.sh
          cd ..
          cd AnyKernel3
          zip -r9 ../Tech-Kernel-GKI-5.10-ZeroMount-VFS.zip . -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-ZeroMount-VFS
          path: Tech-Kernel-GKI-5.10-ZeroMount-VFS.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
