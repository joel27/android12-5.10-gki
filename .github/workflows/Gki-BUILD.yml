name: Tech-Kernel GKI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout GKI kernel source (joel generic main)
        uses: actions/checkout@v4
        with:
          repository: joel27/android12-5.10-gki
          ref: main
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-xaga-gki-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-xaga-gki-

      - name: Install dependencies (incluyendo ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-14 dwarves

      # Este repo pide clang r416183b (confirmado en build.config.common),
      # de 2021 — muy vieja. Voy directo con r584948b (mismo mirror que ya
      # sabes que descarga bien) + KCFLAGS para los warnings nuevos que un
      # clang tan moderno activa contra fuente tan vieja.
      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version
          ccache --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      - name: Install ReSukiSU (inline hook)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/joel27/ReSukiSU/main/kernel/setup.sh" \
            | bash -s main
          echo "ReSukiSU installed"

      - name: Fix sulog type mismatch
        run: |
          SULOG=drivers/kernelsu/sulog/event.c
          if [ -f "$SULOG" ]; then
            sed -i 's/USER_ARG_NULL,/\&(struct user_arg_ptr){ 0 },/g' "$SULOG"
            echo "Patched $SULOG"
          fi

      - name: Apply SuSFS (susfs4ksu 50_)
        run: |
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -R /tmp/susfs4ksu/kernel_patches/fs/*      fs/
          cp -R /tmp/susfs4ksu/kernel_patches/include/* include/
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          echo "SuSFS base applied"

      # FIX (tras sync de fork con esk-project): el patch de SuSFS actualiza
      # solo ALGUNAS llamadas a set_nameidata() para pasar un 4to argumento
      # (fake_filename, parte de SUS_PATH) — pero por el fuzz de aplicar el
      # patch sobre la base recién sincronizada, el hunk que actualiza la
      # DEFINICIÓN no aplicó (se agrega a mano). Eso deja las 4 llamadas
      # ORIGINALES del archivo (las que el patch nunca tocó) con 3
      # argumentos, quedando cortas contra la nueva firma de 4 — se les
      # agrega ", NULL" para que compilen sin cambiar su comportamiento
      # (NULL = "no hay fake_filename, usa el real", igual que las llamadas
      # que sí patcheó SuSFS).
      - name: Fix set_nameidata signature (SuSFS fake_filename param)
        run: |
          FILE=fs/namei.c
          if [ -f "$FILE" ] && grep -q "set_nameidata(nd, old_dfd, fake_filename, NULL)" "$FILE"; then
            sed -i \
              's/static void set_nameidata(struct nameidata \*p, int dfd, struct filename \*name)/static void set_nameidata(struct nameidata *p, int dfd, struct filename *name, const void *fake_filename)/' \
              "$FILE"
            sed -i \
              -e 's/set_nameidata(&nd, dfd, name);/set_nameidata(\&nd, dfd, name, NULL);/g' \
              -e 's/set_nameidata(&nd, dfd, pathname);/set_nameidata(\&nd, dfd, pathname, NULL);/g' \
              -e 's/set_nameidata(&nd, -1, filename);/set_nameidata(\&nd, -1, filename, NULL);/g' \
              "$FILE"
            echo "set_nameidata: firma y las 4 llamadas originales actualizadas"
          else
            echo "No hizo falta tocar nada"
          fi

      # Version-matched con este repo: hardcodeado para clang 12.0.5
      # r416183b, que es justo lo que este repo espera — no genera
      # inconsistencia de versión.
      - name: Apply stock_config patch (fix mensaje HyperOS)
        run: |
          git clone --depth=1 https://github.com/joel27/esk_builder.git /tmp/esk_builder
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/esk_builder/kernel_patches/stock_config.patch
          echo "stock_config patch applied"

      - name: Apply ZeroMount VFS patch
        run: |
          git clone --depth=1 \
            https://github.com/Enginex0/Super-Builders.git /tmp/sb
          PATCH="/tmp/sb/android12-5.10/ReSukiSU/patches/60_zeromount-android12-5.10.patch"
          if [ -f "$PATCH" ]; then
            patch -p1 --fuzz=3 --no-backup-if-mismatch < "$PATCH" || true
            echo "ZeroMount applied"
          fi

      - name: Fix task_mmu.c for ZeroMount
        run: |
          if [ -f fs/proc/task_mmu.c ]; then
            sed -i \
              's/zeromount_spoof_mmap_metadata(inode,/zeromount_spoof_mmap_metadata(vma->vm_file ? file_inode(vma->vm_file) : NULL,/g' \
              fs/proc/task_mmu.c
            echo "task_mmu.c fixed"
          fi

      # Solo borra la etiqueta zm_out en archivos donde NO hay ningún
      # "goto zm_out" en el mismo archivo.
      - name: Remove unused zm_out labels
        run: |
          while IFS= read -r f; do
            if ! grep -q "goto zm_out" "$f"; then
              sed -i '/^[[:space:]]*zm_out:[[:space:]]*$/d' "$f"
            fi
          done < <(grep -rl '^[[:space:]]*zm_out:[[:space:]]*$' --include="*.c" .)
          echo "zm_out labels cleaned (solo las que de verdad no se usan)"

      # El task_mmu.c ya parcheado por SuSFS + ZeroMount (arriba) puede usar
      # VMA_PAD_START(vma) (feature SUS_MAPS de SuSFS). Si este repo trae la
      # macro nativa (pgsize_migration_inline.h) el guard #ifndef la
      # respeta; si no la trae, define el fallback. Corre al final, después
      # de todos los parches que tocan este archivo.
      - name: Fix VMA_PAD_START (SuSFS SUS_MAPS shim)
        run: |
          FILE=fs/proc/task_mmu.c
          if [ -f "$FILE" ] && grep -q "VMA_PAD_START" "$FILE"; then
            LASTINC=$(grep -n '^#include' "$FILE" | tail -1 | cut -d: -f1)
            if [ -n "$LASTINC" ]; then
              awk -v n="$LASTINC" '
                { print }
                NR==n { print ""; print "#ifndef VMA_PAD_START"; print "#define VMA_PAD_START(vma) ((vma)->vm_end)"; print "#endif" }
              ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
              echo "Shim insertado tras el ultimo #include (con guarda ifndef)"
            fi
          else
            echo "No hizo falta tocar nada"
          fi

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

      # CONFIG_KSU_INLINE_HOOK y CONFIG_KSU_KPROBES_HOOK NO EXISTEN en el
      # Kconfig de ReSukiSU — se usan las líneas reales: KSU_SUSFS ("SUSFS
      # Inline Hook", que es a la vez inline hook Y SuSFS) en vez de
      # Tracepoint.
      - name: Configure kernel
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable  CONFIG_KSU \
            --enable  CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_ZEROMOUNT \
            --enable  CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE \
            --set-str CONFIG_LOCALVERSION "-Tech-Kernel" \
            --disable CONFIG_LOCALVERSION_AUTO

          # Símbolo real: CONFIG_LLVM_POLLY (no CONFIG_POLLY). Este repo
          # trae CONFIG_LLVM_POLLY=y de fábrica en gki_defconfig.
          ./scripts/config --file out/.config --disable CONFIG_LLVM_POLLY || true

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel (con ccache)
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %b %d %H:%M:%S UTC %Y')" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="esk" \
            Image 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/ESK-Project/AnyKernel3.git \
            -b generic AnyKernel3
          rm -rf AnyKernel3/config AnyKernel3/modules \
                 AnyKernel3/patch  AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          zstd -19 --no-progress -q \
            -o AnyKernel3/Image.zst AnyKernel3/Image
          rm AnyKernel3/Image
          cd AnyKernel3
          sha256sum Image.zst > Image.zst.sha256
          printf '%s\n' \
            "properties() { '" \
            'kernel.string=Tech-Kernel GKI android12-5.10 | ReSukiSU+SUSFS+ZeroMount | xaga' \
            'do.devicecheck=0' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'supported.versions=' \
            "'; }" \
            'BLOCK=boot' \
            'IS_SLOT_DEVICE=1' \
            'RAMDISK_COMPRESSION=auto' \
            'PATCH_VBMETA_FLAG=auto' \
            'NO_MAGISK_CHECK=true' \
            '. tools/ak3-core.sh' \
            'ui_print "****************************************"' \
            'ui_print "   Instalando Tech-Kernel android12-5.10 "' \
            'ui_print "   GKI puro - xaga                       "' \
            'ui_print "****************************************"' \
            '"$BIN/busybox" sha256sum -cs Image.zst.sha256 || abort "[!] SHA256 mismatch"' \
            '"$BIN/zstd" -d -q --no-progress -o "$AKHOME/Image" "$AKHOME/Image.zst" || abort "[!] Decompress failed"' \
            'split_boot' \
            'if [ -f "$SPLITIMG/ramdisk.cpio" ]; then' \
            '  unpack_ramdisk; write_boot' \
            'else' \
            '  flash_boot' \
            'fi' \
            'rm -f "$AKHOME/Image"' \
            > anykernel.sh
          cd ..
          cd AnyKernel3
          zip -r9 ../Tech-Kernel-android12-5.10-Gki-xaga.zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-android12-5.10-Gki-xaga
          path: Tech-Kernel-android12-5.10-Gki-xaga.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-gki-xaga
          path: build.log
