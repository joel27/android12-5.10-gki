name: Tech LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout GKI kernel source (joel generic main)
        uses: actions/checkout@v4
        with:
          repository: joel27/android12-5.10-gki
          ref: main
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-xaga-lkm-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-xaga-lkm-

      - name: Install dependencies (incluyendo ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-14 dwarves

      # Este repo pide clang r416183b (confirmado en build.config.common:
      # CLANG_PREBUILT_BIN=.../clang-r416183b/bin), de 2021 — muy vieja.
      # Ya nos pasó con el repo de vermeer que perseguir la version exacta
      # desde el repo oficial de Google cuesta varias vueltas (ramas que no
      # existen, endpoints que dan 400/403). Esta vez voy directo con
      # r584948b (mismo mirror que ya sabes que descarga bien) + KCFLAGS para
      # los warnings nuevos que un clang tan moderno activa contra fuente tan
      # vieja. Si quieres perseguir la version exacta después, se puede, pero
      # así avanzamos ya con algo que sabemos que funciona.
      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version
          ccache --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      - name: Install ReSukiSU (inline hook)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/joel27/ReSukiSU/main/kernel/setup.sh" \
            | bash -s main
          echo "ReSukiSU installed"

      - name: Fix sulog type mismatch
        run: |
          SULOG=drivers/kernelsu/sulog/event.c
          if [ -f "$SULOG" ]; then
            sed -i 's/USER_ARG_NULL,/\&(struct user_arg_ptr){ 0 },/g' "$SULOG"
            echo "Patched $SULOG"
          fi

      - name: Apply SuSFS (susfs4ksu 50_)
        run: |
          git clone --depth=1 -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp -R /tmp/susfs4ksu/kernel_patches/fs/*      fs/
          cp -R /tmp/susfs4ksu/kernel_patches/include/* include/
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          echo "SuSFS base applied"

      # A diferencia de vermeer (5.15), aquí SÍ dejo el stock_config patch:
      # está hardcodeado para clang 12.0.5 r416183b, que es justo lo que este
      # repo realmente espera (confirmado arriba) — no hay desfase de versión
      # como en vermeer, así que no genera la inconsistencia que me hizo
      # quitarlo allá.
      - name: Apply stock_config patch (fix mensaje HyperOS)
        run: |
          git clone --depth=1 https://github.com/joel27/esk_builder.git /tmp/esk_builder
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/esk_builder/kernel_patches/stock_config.patch
          echo "stock_config patch applied"

      # No hace falta el shim de VMA_PAD_START aquí: ese problema es en
      # fs/proc/task_mmu.c (parte de ZeroMount/SUS_MAPS), y este workflow NO
      # compila el kernel completo, solo el módulo drivers/kernelsu/.

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

      # CONFIG_KSU en "m" (módulo) en vez de "y" — confirmado en el Kconfig
      # de ReSukiSU que es tristate y admite LKM. CONFIG_KSU_INLINE_HOOK y
      # CONFIG_KSU_KPROBES_HOOK NO EXISTEN en este Kconfig (lo verificamos
      # con vermeer, es el mismo ReSukiSU) — se quitan esas líneas muertas.
      # El hook method real disponible junto con KSU=m es SUSFS ("SUSFS
      # Inline Hook") o Tracepoint; como quieres SUSFS, se deja esa activa.
      - name: Configure kernel (KSU como módulo)
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --module  CONFIG_KSU \
            --enable  CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_TRACEPOINT_HOOK \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE \
            --set-str CONFIG_LOCALVERSION "-Tech-Kernel" \
            --disable CONFIG_LOCALVERSION_AUTO

          # Símbolo real: CONFIG_LLVM_POLLY (no CONFIG_POLLY, ese nombre no
          # existe). Este repo trae CONFIG_LLVM_POLLY=y de fábrica en
          # gki_defconfig (igual que vermeer), así que este disable sí hace
          # algo real.
          ./scripts/config --file out/.config --disable CONFIG_LLVM_POLLY || true

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: modules_prepare
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare 2>&1 | tee prepare.log

      # drivers/kernelsu necesita include/generated/compile.h y
      # security/selinux/flask.h, que modules_prepare no genera. No se puede
      # apuntar al header directo (Kbuild no lo expone como target de nivel
      # superior); se apunta al .o que lo dispara: init/version.o para
      # compile.h, security/selinux/hooks.o para flask.h. El KCFLAGS es por
      # el mismo problema de warnings-nuevos-en-clang-viejo que en vermeer.
      - name: Generate missing headers (compile.h, flask.h)
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            init/version.o security/selinux/hooks.o

      # Build dirigido SOLO a drivers/kernelsu/ (symlink que deja setup.sh),
      # no al kernel completo.
      - name: Build kernelsu.ko
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/kernelsu modules \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %b %d %H:%M:%S UTC %Y')" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="esk" \
            2>&1 | tee build.log
          find out -name "kernelsu.ko" -exec cp {} ./kernelsu.ko \;
          ls -la kernelsu.ko

      # ksuinit: binario oficial precompilado de KernelSU (Rust, genérico,
      # no depende de tus parches) — verificado que se publica como asset
      # de GitHub Releases.
      - name: Fetch ksuinit (binario oficial precompilado)
        run: |
          curl -fL -o ksuinit \
            "https://github.com/tiann/KernelSU/releases/latest/download/ksuinit"
          chmod +x ksuinit
          ls -la ksuinit

      - name: Package LKM artifact
        run: |
          mkdir -p lkm_out
          cp kernelsu.ko lkm_out/
          cp ksuinit lkm_out/
          printf '%s\n' \
            'Este paquete NO es flasheable directo. Contiene:' \
            '  - kernelsu.ko  (tu modulo custom, con SUSFS, compilado en CI)' \
            '  - ksuinit      (stub oficial de KernelSU, binario generico)' \
            '' \
            'Para meterlo en tu boot.img (xaga no usa init_boot separado en' \
            'Android 12), en tu PC o en Termux en el propio telefono, con' \
            'magiskboot:' \
            '' \
            '  magiskboot unpack boot.img' \
            '  magiskboot cpio ramdisk.cpio "mv init init.real"' \
            '  magiskboot cpio ramdisk.cpio "add 0755 init ksuinit"' \
            '  magiskboot cpio ramdisk.cpio "add 0755 kernelsu.ko kernelsu.ko"' \
            '  magiskboot repack boot.img' \
            '  # el resultado queda en new-boot.img' \
            '' \
            'Guarda tu boot.img original antes de tocar nada.' \
            > lkm_out/LEEME.txt
          cd lkm_out
          zip -r9 ../Tech-Kernel-LKM-xaga.zip .

      - name: Upload LKM package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-LKM-xaga
          path: Tech-Kernel-LKM-xaga.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-lkm-xaga
          path: |
            build.log
            prepare.log
