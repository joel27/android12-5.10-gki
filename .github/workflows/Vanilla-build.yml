name: Tech-Kernel GKI (Clean, sin root)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout GKI kernel source (joel generic main)
        uses: actions/checkout@v4
        with:
          repository: joel27/android12-5.10-gki
          ref: main
          fetch-depth: 1

      - name: Log kernel source commit
        run: git rev-parse HEAD

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-xaga-gki-clean-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-xaga-gki-clean-

      - name: Install dependencies (incluyendo ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-14 dwarves

      # Este repo pide clang r416183b (confirmado en build.config.common),
      # de 2021 — muy vieja. Voy directo con r584948b (mismo mirror que ya
      # sabes que descarga bien) + KCFLAGS para los warnings nuevos que un
      # clang tan moderno activa contra fuente tan vieja.
      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version
          ccache --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      # Version-matched con este repo: hardcodeado para clang 12.0.5
      # r416183b, que es justo lo que este repo espera — no genera
      # inconsistencia de versión. No tiene relación con root/SuSFS, solo
      # evita el aviso de "kernel modificado" de HyperOS al iniciar.
      - name: Apply stock_config patch (fix mensaje HyperOS)
        run: |
          git clone --depth=1 https://github.com/joel27/esk_builder.git /tmp/esk_builder
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < /tmp/esk_builder/kernel_patches/stock_config.patch
          echo "stock_config patch applied"

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

      - name: Configure kernel
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE \
            --set-str CONFIG_LOCALVERSION "-Tech-Kernel" \
            --disable CONFIG_LOCALVERSION_AUTO

          # Símbolo real: CONFIG_LLVM_POLLY (no CONFIG_POLLY). Este repo
          # trae CONFIG_LLVM_POLLY=y de fábrica en gki_defconfig.
          ./scripts/config --file out/.config --disable CONFIG_LLVM_POLLY || true

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel (con ccache)
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=uninitialized-const-pointer -Wno-error=default-const-init-unsafe" \
            KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %b %d %H:%M:%S UTC %Y')" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="esk" \
            Image 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/ESK-Project/AnyKernel3.git \
            -b generic AnyKernel3
          rm -rf AnyKernel3/config AnyKernel3/modules \
                 AnyKernel3/patch  AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          zstd -19 --no-progress -q \
            -o AnyKernel3/Image.zst AnyKernel3/Image
          rm AnyKernel3/Image
          cd AnyKernel3
          sha256sum Image.zst > Image.zst.sha256
          printf '%s\n' \
            "properties() { '" \
            'kernel.string=Tech-Kernel GKI android12-5.10 | Clean (sin root) | xaga' \
            'do.devicecheck=0' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'supported.versions=' \
            "'; }" \
            'BLOCK=boot' \
            'IS_SLOT_DEVICE=1' \
            'RAMDISK_COMPRESSION=auto' \
            'PATCH_VBMETA_FLAG=auto' \
            'NO_MAGISK_CHECK=true' \
            '. tools/ak3-core.sh' \
            'ui_print "****************************************"' \
            'ui_print "   Instalando Tech-Kernel android12-5.10 "' \
            'ui_print "   GKI limpio (sin root) - xaga           "' \
            'ui_print "****************************************"' \
            '"$BIN/busybox" sha256sum -cs Image.zst.sha256 || abort "[!] SHA256 mismatch"' \
            '"$BIN/zstd" -d -q --no-progress -o "$AKHOME/Image" "$AKHOME/Image.zst" || abort "[!] Decompress failed"' \
            'split_boot' \
            'if [ -f "$SPLITIMG/ramdisk.cpio" ]; then' \
            '  unpack_ramdisk; write_boot' \
            'else' \
            '  flash_boot' \
            'fi' \
            'rm -f "$AKHOME/Image"' \
            > anykernel.sh
          cd ..
          cd AnyKernel3
          zip -r9 ../Tech-Kernel-android12-5.10-Gki-xaga-Clean.zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-android12-5.10-Gki-xaga-Clean
          path: Tech-Kernel-android12-5.10-Gki-xaga-Clean.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-gki-xaga-clean
          path: build.log
